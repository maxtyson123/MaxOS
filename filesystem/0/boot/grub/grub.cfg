set default=0
set timeout=10

loadfont /boot/grub/fonts/unicode.pf2
insmod vbe
insmod video
insmod all_video
insmod gfxterm
set gfxmode=1280x800x32
set gfxpayload=keep
terminal_output gfxterm
boot

menuentry "Max OS" {
    echo "Max OS by Max Tyson || (64 Bit Mode)"
    echo "===================================="
    echo "Loading Kernel..."
    multiboot2 /boot/MaxOSk64
    module2 /boot/Init.elf Init
    module2 /boot/FileServer.elf FileServer
    module2 /boot/maxos.initrd initrd
    boot
}
